name: Sync Hugging Face Dataset

on:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "hf_dataset/**"
      - "LICENSE"
      - "scripts/upload_to_huggingface.py"
      - ".github/workflows/sync-huggingface-dataset.yml"
  workflow_dispatch:
    inputs:
      repo_id:
        description: "Optional Hugging Face dataset repo id override"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sync-huggingface-dataset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO_ID: ${{ inputs.repo_id || vars.HF_DATASET_REPO_ID || 'shanewang/ToxiRewriteCN' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub client
        run: python -m pip install "huggingface_hub>=0.23.0"

      - name: Check Hugging Face token
        if: env.HF_TOKEN == ''
        run: |
          echo "::notice::HF_TOKEN is not set. Add a Hugging Face write token as a repository secret to enable automatic dataset sync."

      - name: Upload dataset to Hugging Face
        if: env.HF_TOKEN != ''
        run: python scripts/upload_to_huggingface.py --repo-id "$HF_DATASET_REPO_ID"
